name: Android 17 preview delivery checks
on:
  push:
    branches: [feat/easytier-native]
    paths:
      - 'scripts/android17_preview.py'
      - 'scripts/test_android17_preview.py'
      - 'delivery/android17-preview.json'
      - '.github/workflows/android17-delivery-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  distribution-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Platform, integrity and non-destructive installer regression
        run: python3 scripts/test_android17_preview.py
