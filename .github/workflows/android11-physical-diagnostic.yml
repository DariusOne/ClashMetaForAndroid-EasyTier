name: Android 11 physical diagnostic build
on:
  push:
    branches: [feat/easytier-native]
    paths:
      - '.github/workflows/android11-physical-diagnostic.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  api30-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          submodules: recursive
      - name: Reuse compiler inputs only
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            ~/.gradle/caches/
            ~/.gradle/wrapper/
            ~/.cache/go-build/
            ~/go/pkg/mod/
          key: api30-diagnostic-compiler-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', '**/go.mod', '**/go.sum') }}
          restore-keys: |
            packet-compiler-v1-${{ runner.os }}-jdk21-go126-c1278af-
      - name: Retrieve pinned arm64 native payload
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: native-prototype-arm64-v8a
          path: core/build/native-jni/arm64-v8a
          run-id: 40841757177
          github-token: ${{ github.token }}
      - name: Retrieve pinned x86_64 native payload
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: native-prototype-x86_64
          path: core/build/native-jni/x86_64
          run-id: 40841757177
          github-token: ${{ github.token }}
      - name: Verify native source identity before reuse
        run: |
          python3 scripts/build-easytier-android.py --abi arm64-v8a --verify-only
          python3 scripts/build-easytier-android.py --abi x86_64 --verify-only
      - name: Set up pinned Go and Java
        run: |
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
          curl --fail --location --output "$RUNNER_TEMP/go.tar.gz" https://github.com/MetaCubeX/go/releases/download/build/go1.26.linux-amd64.tar.gz
          echo "c1278af2579c9398cf22c638686e5348926b160eda784930d416d95aaa7a9221  $RUNNER_TEMP/go.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/go.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/go/bin" >> "$GITHUB_PATH"
          cd "$RUNNER_TEMP/go"
          for p in "$GITHUB_WORKSPACE"/.github/patch/*.patch; do patch -p 1 < "$p"; done
      - name: Compile debug-only API 30 counterpart with matching instrumentation
        run: ./gradlew --no-daemon -PnativeMeshHarness=true -PnativeMeshDiagnosticApi30=true service:testMetaDebugUnitTest app:assembleMetaDebug app:assembleMetaDebugAndroidTest
      - name: Verify actual manifest and native libraries
        run: python3 scripts/verify-packet-prototype.py app/build/outputs/apk/meta/debug --android11-diagnostic
      - name: Publish diagnostic inputs, never acceptance or release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: android11-physical-DIAGNOSTIC-NOT-RELEASE
          path: |
            app/build/outputs/apk/meta/debug/*universal*.apk
            app/build/outputs/apk/meta/debug/prototype-verification.json
            app/build/outputs/apk/androidTest/meta/debug/*.apk
          if-no-files-found: error
          retention-days: 14
