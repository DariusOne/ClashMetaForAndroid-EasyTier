[package]
name = "cmfa-easytier"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-only"
publish = false

[lib]
name = "cmfa_easytier"
crate-type = ["cdylib", "rlib"]

[workspace]

[dependencies]
easytier = { path = "../easytier-upstream/easytier", default-features = false, features = ["tun", "aes-gcm", "websocket", "wireguard", "quic", "smoltcp", "magic-dns", "zstd"] }
jni = "0.21.1"
libc = "0.2"
serde_json = "1"
toml = "0.8"
uuid = { version = "1", features = ["v4"] }

[profile.release]
panic = "abort"
lto = "thin"
codegen-units = 1
strip = "debuginfo"
